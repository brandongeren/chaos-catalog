# Builds the app and the card data, then publishes both to GitHub Pages.
# Runs on every push to main, once a day (new cards, banlists, Genesys points, prices), and on demand.
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 21 * * *' # daily, 21:17 UTC: after TCGCSV's ~20:00 UTC price update
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # Earlier days' price files are read back from the live site, so they never need committing.
      - name: Build card data
        run: npm run build:data -- --previous "${{ steps.pages.outputs.base_url }}/data"
      - name: Build app
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Supabase's free tier pauses a project after 7 days without activity; a small daily read keeps it awake.
  # Skipped until the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets are set (README "Supabase").
  keep-supabase-awake:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase secrets not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error "$SUPABASE_URL/rest/v1/app_status?select=id" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY"
